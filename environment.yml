name: ctm-for-mapf
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - -e .[dev]
      # Keep the CTM repo's broad dependency list, but expose the CUDA 12.8
      # wheel index and pin torch explicitly so fresh environments do not drift
      # to a CUDA build newer than the cluster driver.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - -r third_party/continuous-thought-machines/requirements.txt
      - pogema==1.4.0
      - tensorboard==2.20.0
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
